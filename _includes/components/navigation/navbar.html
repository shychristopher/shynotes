<nav class="navbar sticky-top bg-body-tertiary border-bottom d-print-none">
  <div class="container-fluid">
    <div class="d-flex align-items-center gap-2">
      {% if include.sidebar_id %}
        <button
          class="navbar-toggler border-0 p-1 d-lg-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#{{ include.sidebar_id }}"
          aria-controls="{{ include.sidebar_id }}"
          aria-label="Toggle sidebar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      {% endif %}

      <a class="navbar-brand d-inline-flex align-items-center gap-2 mb-0" href="{{ '/' | relative_url }}">
        <img src="/assets/images/logo.jpg" alt="Logo" width="26" height="26" class="rounded-circle object-fit-cover">
        <span>{{ site.title }}</span>
      </a>
    </div>

    <div class="d-flex align-items-center gap-3">
      <a
        class="nav-link{% if page.url contains '/courses' %} active fw-semibold{% endif %}"
        {% if page.url contains '/courses' %}aria-current="page"{% endif %}
        href="{{ '/courses/' | relative_url }}"
      >
        Courses
      </a>

      <button
        type="button"
        class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1"
        data-bs-toggle="modal"
        data-bs-target="#displaySettingsModal"
        title="Display & accessibility settings"
        aria-label="Open display and accessibility settings"
      >
        <span class="fw-semibold" aria-hidden="true">Aa</span>
        <span class="d-none d-md-inline">Display</span>
      </button>

      {% assign fb = site.firebase %}
      {% if fb and fb.api_key and fb.api_key != "" and fb.project_id and fb.project_id != "" %}
        <button
          type="button"
          id="cloudSyncNavBtn"
          class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1 position-relative"
          data-bs-toggle="modal"
          data-bs-target="#cloudSyncModal"
          title="Cloud sync & account"
          aria-label="Open cloud sync and account settings"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
          </svg>
          <span class="d-none d-md-inline" id="cloudSyncNavLabel">Sign in</span>
          <span
            id="cloudSyncNavDot"
            class="position-absolute top-0 start-100 translate-middle p-1 bg-success border border-light rounded-circle d-none"
          ></span>
        </button>
      {% endif %}

      {% if site.repo.url %}
        <a
          href="{{ site.repo.url }}"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center gap-1"
        >
          <span>GitHub</span>
          <span aria-hidden="true">↗</span>
        </a>
      {% endif %}

      {% if include.right_sidebar_id %}
        <button
          class="navbar-toggler border-0 p-1 d-xl-none position-relative{% if include.right_sidebar_class %} {{ include.right_sidebar_class }}{% endif %}"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#{{ include.right_sidebar_id }}"
          aria-controls="{{ include.right_sidebar_id }}"
          aria-label="Toggle filters"
        >
          <span class="navbar-toggler-icon"></span>
          <span
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-primary d-none"
            id="glossaryMobileFilterCount"
            style="font-size: 0.65rem;"
          >0</span>
        </button>
      {% endif %}
    </div>
  </div>
</nav>
