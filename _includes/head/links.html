<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
  crossorigin="anonymous"
>
<style>
  html.print-mode {
    color-scheme: light;
  }
  html.print-mode .d-print-none {
    display: none !important;
  }
  html.print-mode body {
    background: #fff !important;
    color: #000 !important;
  }
  @media print {
    body {
      background: #fff !important;
      color: #000 !important;
    }
  }
</style>
<script>
  (() => {
    const params = new URLSearchParams(window.location.search);
    const printParam = params.get("print");
    const isPrintMode = params.has("print") && printParam !== "false" && printParam !== "0";
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    const applyTheme = (isDark) => {
      document.documentElement.setAttribute("data-bs-theme", isDark ? "dark" : "light");
    };

    if (isPrintMode) {
      document.documentElement.classList.add("print-mode");
      applyTheme(false);
    } else {
      applyTheme(mediaQuery.matches);
      mediaQuery.addEventListener("change", (event) => applyTheme(event.matches));
      window.addEventListener("beforeprint", () => applyTheme(false));
      window.addEventListener("afterprint", () => applyTheme(mediaQuery.matches));
    }
  })();
</script>
{% if page.custom_css %}
  {% for stylesheet in page.custom_css %}
    <link rel="stylesheet" href="{{ stylesheet | relative_url }}">
  {% endfor %}
{% endif %}
