{% assign filter_tags = include.tags %}

<div
  class="offcanvas offcanvas-end"
  tabindex="-1"
  id="courseFilterDrawer"
  aria-labelledby="courseFilterDrawerLabel"
>
  <div class="offcanvas-header border-bottom">
    <h2 class="offcanvas-title h5 fw-bold" id="courseFilterDrawerLabel">Filter Courses</h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>

  <div class="offcanvas-body d-flex flex-column gap-4">
    <!-- Visibility / Status Toggles -->
    <div>
      <h3 class="h6 fw-semibold text-uppercase text-body-secondary small mb-3">Visibility</h3>

      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" role="switch" id="onlyFeaturedSwitch">
        <label class="form-check-label" for="onlyFeaturedSwitch">
          Only show featured courses
        </label>
      </div>

      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" id="hideDeprecatedSwitch">
        <label class="form-check-label" for="hideDeprecatedSwitch">
          Hide deprecated / inactive courses
        </label>
      </div>
    </div>

    <!-- Dynamic Unique Tags -->
    {% if filter_tags.size > 0 %}
      <div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h3 class="h6 fw-semibold text-uppercase text-body-secondary small mb-0">Tags</h3>
          <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none d-none" id="clearTagsBtn">
            Clear tags
          </button>
        </div>
        <p class="small text-body-secondary mb-2">Select one or more tags to filter:</p>
        <div class="d-flex flex-wrap gap-2" id="tagFilterList">
          {% for tag in filter_tags %}
            {% assign tag_id = "tag-" | append: forloop.index %}
            <input
              type="checkbox"
              class="btn-check tag-checkbox"
              id="{{ tag_id }}"
              value="{{ tag | downcase | escape }}"
              autocomplete="off"
            >
            <label class="btn btn-sm btn-outline-secondary rounded-pill" for="{{ tag_id }}">
              {{ tag }}
            </label>
          {% endfor %}
        </div>
      </div>
    {% endif %}

    <div class="mt-auto pt-3 border-top d-flex justify-content-between gap-2">
      <button type="button" class="btn btn-outline-secondary w-50" id="drawerResetBtn">
        Reset All
      </button>
      <button type="button" class="btn btn-primary w-50" data-bs-dismiss="offcanvas">
        Done
      </button>
    </div>
  </div>
</div>
