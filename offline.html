<div class="mx-auto py-4" style="max-width: 34rem;">
  <div class="card border bg-body-tertiary">
    <div class="card-body p-4 text-center">
      <div class="text-body-secondary mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M10.706 3.294A12.6 12.6 0 0 0 8 3C5.259 3 2.723 3.882.663 5.379a.485.485 0 0 0-.048.736.52.52 0 0 0 .668.05A11.45 11.45 0 0 1 8 4q.946 0 1.852.148zM8 6c-1.905 0-3.68.56-5.166 1.526a.48.48 0 0 0-.063.745.525.525 0 0 0 .652.065 8.45 8.45 0 0 1 3.51-1.27zm2.596 1.404.785-.785q.947.362 1.785.907a.482.482 0 0 1 .063.745.525.525 0 0 1-.652.065 8.5 8.5 0 0 0-1.98-.932zM8 10l.933-.933a6.5 6.5 0 0 1 2.013.637c.285.145.326.524.1.75l-.015.015a.53.53 0 0 1-.611.09A5.5 5.5 0 0 0 8 10m4.905-4.905.747-.747q.886.451 1.685 1.03a.485.485 0 0 1 .047.737.52.52 0 0 1-.668.05 11.5 11.5 0 0 0-1.811-1.07M9.02 11.78c.238.14.236.464.04.66l-.707.706a.5.5 0 0 1-.707 0l-.707-.707c-.195-.195-.197-.518.04-.66A2 2 0 0 1 8 11.5c.374 0 .723.102 1.021.28zm4.355-9.905a.53.53 0 0 1 .75.75l-10.75 10.75a.53.53 0 0 1-.75-.75z"/>
        </svg>
      </div>
      <h1 class="h4 fw-bold mb-2">You’re currently offline</h1>
      <p class="small text-body-secondary mb-3">
        This page hasn’t been saved for offline study yet. Any course you’ve already opened is saved automatically and ready to read below.
      </p>

      <div id="offlineCoursesWrap" class="d-none text-start border-top pt-3 mb-3">
        <div class="small text-uppercase text-body-secondary fw-semibold mb-2" style="font-size: 0.72rem; letter-spacing: 0.05em;">
          Available Offline
        </div>
        <div id="offlineCoursesList" class="list-group list-group-flush rounded border"></div>
      </div>

      <div class="d-flex justify-content-center gap-2">
        <a href="{{ '/courses/' | relative_url }}" class="btn btn-sm btn-primary">Course Catalog</a>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.location.reload()">Try Again</button>
      </div>
    </div>
  </div>
</div>

<script>
  (() => {
    if (!("caches" in window)) return;
    const prefix = "shynotes-course-";
    const wrap = document.getElementById("offlineCoursesWrap");
    const list = document.getElementById("offlineCoursesList");
    if (!wrap || !list) return;

    window.caches.keys().then((keys) => {
      const slugs = keys.filter((k) => k.startsWith(prefix)).map((k) => k.slice(prefix.length));
      if (!slugs.length) return;
      wrap.classList.remove("d-none");
      slugs.sort().forEach((slug) => {
        const a = document.createElement("a");
        a.href = `{{ '/courses/' | relative_url }}${encodeURIComponent(slug)}/`;
        a.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center small";
        a.innerHTML = `<span class="fw-semibold text-uppercase">${slug}</span><span class="text-body-secondary">Open offline →</span>`;
        list.appendChild(a);
      });
    });
  })();
</script>
