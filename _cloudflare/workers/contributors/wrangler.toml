name = "shynotes-contributors-sync"
main = "index.js"
compatibility_date = "2026-11-01"

[vars]
GH_OWNER = "shychristopher"
GH_REPO = "shynotes"
CDN_BASE_URL = "https://cdn.shynotes.org"

[triggers]
crons = ["0 6 * * *"]

[[r2_buckets]]
binding = "CONTRIBUTORS_BUCKET"
bucket_name = "shynotes"

[observability.logs]
enabled = true
invocation_logs = true